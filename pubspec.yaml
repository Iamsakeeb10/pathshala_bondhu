name: pathshala_bondhu
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  go_router: ^17.0.0
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.5.3
  connectivity_plus: ^7.0.0
  intl: ^0.20.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  dio: ^5.9.0
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.3
  flutter_local_notifications: ^19.5.0
  expandable_text: ^2.3.0
  timeago: ^3.7.1
  flashy_tab_bar2: ^0.0.10
  # Chat dependencies
  socket_io_client: ^2.0.3+1
  http: ^1.2.2
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.5
  flutter_localizations:
    sdk: flutter
  google_fonts: ^7.0.2

dev_dependencies:
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.1

  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"

  # For adaptive icons (Android 8.0+)
  adaptive_icon_background: "#F5F9F2" # Your primary color
  adaptive_icon_foreground: "assets/images/app_logo.png"
  adaptive_icon_padding: 0

  # Minimum SDK version
  min_sdk_android: 21

  # Different icons for different platforms
  # image_path_android: "assets/images/icon-android.png"
  # image_path_ios: "assets/images/icon-ios.png"

  # Web icon (if you have web support)
  web:
    generate: true
    image_path: "assets/images/app_logo.png"
    background_color: "#FFFFFF"
    theme_color: "#F5F9F2"
